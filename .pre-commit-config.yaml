# Install once per clone: uv run pre-commit install
# - pre-commit: runs the full test suite; the commit is rejected if any test fails.
# - commit-msg: the message must start with a ticket prefix, e.g. "HL07: ...".
default_install_hook_types: [pre-commit, commit-msg]

repos:
  - repo: local
    hooks:
      - id: pytest
        name: pytest (full suite)
        entry: uv run pytest -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-commit]
      - id: commit-msg-ticket
        name: commit message starts with HL[num][num]
        entry: uv run python scripts/check_commit_msg.py
        language: system
        stages: [commit-msg]
